name: Publish Island: the small world (live site from main)
# The live site is main: every merge to main publishes it. Design branches no longer publish over it
# (before 19 Nov 2026 only design/lab-visual-polish did, so merges to main never reached the site).
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: island-lab-preview
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Pages must be enabled by a repository administrator in Settings > Pages.
      # Do not attempt to create the Pages site with the restricted Actions token.
      - name: Make Island Lab the playable homepage
        run: |
          mkdir -p _site
          cp -R dist/. _site/
          cp dist/world.html _site/index.html   # the small world is the app; frozen test worlds live under /frozen/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
